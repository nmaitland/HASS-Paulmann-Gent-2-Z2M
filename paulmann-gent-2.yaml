# Paulmann Gent 2 Blueprint for Home Assistant - Simplified
# Version 2.0.0.0
# By nmaitland based on zha version by IceBeach7
#

# https://github.com/nmaitland/HASS-Paulmann-Gent-2

blueprint:
  domain: automation
  name: "Paulmann Gent 2 (501.40) - Z2M for lights"
  description: "Simplified version - Control up to 4 lights with the Paulmann Gent 2 remote in Home Assistant through Z2M."

  input:
    # Remote to use
    remote_action:
      name: Remote MQTT Topic
      description: "Enter your Paulmann Gent 2 MQTT topic (i.e. zigbee2mqtt/gent2_remote)"
      selector:
        text: {}

    # Light selections for each scene
    s1_section:
      name: "Scene 1"
      icon: mdi:numeric-1-box
      collapsed: true
      input:
        sc1_light:
          name: "💡 Light Device"
          description: "Select the light to control with Scene 1"
          selector:
            entity:
              filter:
                - domain: light
          default: ""

        sc1_color_wheel_brightness:
          name: "🎚️ Color wheel - Brightness"
          selector:
            number:
              min: 0
              max: 255
          default: 127

    s2_section:
      name: "Scene 2"
      icon: mdi:numeric-2-box
      collapsed: true
      input:
        sc2_light:
          name: "💡 Light Device"
          description: "Select the light to control with Scene 2"
          selector:
            entity:
              filter:
                - domain: light
          default: ""

        sc2_color_wheel_brightness:
          name: "🎚️ Color wheel - Brightness"
          selector:
            number:
              min: 0
              max: 255
          default: 127

    s3_section:
      name: "Scene 3"
      icon: mdi:numeric-3-box
      collapsed: true
      input:
        sc3_light:
          name: "💡 Light Device"
          description: "Select the light to control with Scene 3"
          selector:
            entity:
              filter:
                - domain: light
          default: ""

        sc3_color_wheel_brightness:
          name: "🎚️ Color wheel - Brightness"
          selector:
            number:
              min: 0
              max: 255
          default: 127

    s4_section:
      name: "Scene 4"
      icon: mdi:numeric-4-box
      collapsed: true
      input:
        sc4_light:
          name: "💡 Light Device"
          description: "Select the light to control with Scene 4"
          selector:
            entity:
              filter:
                - domain: light
          default: ""

        sc4_color_wheel_brightness:
          name: "🎚️ Color wheel - Brightness"
          selector:
            number:
              min: 0
              max: 255
          default: 127

    # Global settings
    brightness_step:
      name: "🔆 Brightness Step"
      description: "Percentage to increase/decrease brightness"
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
      default: 10

    color_temp_step:
      name: "🌡️ Color Temperature Step"
      description: "Amount to change color temperature"
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "mireds"
      default: 40

    # Add this to the blueprint inputs section
    helper_prefix:
      name: "Helper Name Prefix"
      description: "Prefix for the input_text helpers used to store scene data (e.g., 'living_room', 'bedroom', 'paulmann_remote_1'). Helpers will be named: [prefix]_scene_[scene]_[instance]"
      selector:
        text: {}
      default: "paulmann_remote_"    

trigger:
  - platform: mqtt
    topic: !input remote_action

mode: queued

action:
  - variables:
      split_input: "{{ trigger.payload_json.action.split('_') }}"
      action_parts: "{{ split_input[:-1] }}"
      action: "{{ action_parts | join('_') }}"
      instance: "{{ split_input[-1] | int }}"
      
      # Check if this is a store action
      is_store_action: "{{ action_parts[0] == 'store' }}"
      is_recall_action: "{{ action_parts[0] == 'recall' }}"
      scene_number: "{{ action_parts[1] | int if is_store_action or is_recall_action else 0 }}"
      
      # First get all the input variables
      sc1_light: !input "sc1_light"
      sc2_light: !input "sc2_light"
      sc3_light: !input "sc3_light"
      sc4_light: !input "sc4_light"
      sc1_color_wheel_brightness: !input "sc1_color_wheel_brightness"
      sc2_color_wheel_brightness: !input "sc2_color_wheel_brightness"
      sc3_color_wheel_brightness: !input "sc3_color_wheel_brightness"
      sc4_color_wheel_brightness: !input "sc4_color_wheel_brightness"
      brightness_step_val: !input "brightness_step"
      color_temp_step_val: !input "color_temp_step"
      helper_prefix: !input "helper_prefix"

      # Now get the appropriate light and brightness based on instance
      target_light: >
        {% set lights = {
          1: sc1_light,
          2: sc2_light,
          3: sc3_light,
          4: sc4_light
        } %}
        {{ lights.get(instance, "") }}
      
      target_brightness: >
        {% set brightness = {
          1: sc1_color_wheel_brightness,
          2: sc2_color_wheel_brightness,
          3: sc3_color_wheel_brightness,
          4: sc4_color_wheel_brightness
        } %}
        {{ brightness.get(instance, 255) }}
      
      # Dynamic storage helper entity names using the configurable prefix
      storage_entity: "input_text.{{ helper_prefix }}_{{ scene_number }}_{{ instance }}"
      
      # Default brightness levels for fallback
      default_brightness: >
        {% set defaults = {
          1: 36,
          2: 72,
          3: 108,
          4: 144,
          5: 180,
          6: 216,
          7: 255
        } %}
        {{ defaults.get(scene_number, 255) }}

  - service: persistent_notification.create
    data:
      title: "Debug Store Operation"
      message: |
        action: {{ action }}
        instance: {{ instance }}
        is_store_action: {{ is_store_action }}
        scene_number: {{ scene_number }}
        is_recall_action: {{ is_recall_action }}
        helper_prefix: {{ helper_prefix }}
        storage_entity: {{ storage_entity }}
        
  # Only proceed if a light is configured for this instance
  - condition: template
    value_template: "{{ target_light != '' and target_light != 'unavailable' and target_light != 'unknown' }}"

  - choose:
    # Store scene action
    - conditions:
        - condition: template
          value_template: "{{ is_store_action }}"
      sequence:
        - service: input_text.set_value
          target:
            entity_id: "{{ storage_entity }}"
          data:
            value: >
              {% set light_state = states[target_light] %}
              {% if light_state.state == 'on' %}
                {% set attrs = light_state.attributes %}
                {% if attrs.hs_color is defined %}
                  {{ {
                    'hue': attrs.hs_color[0],
                    'saturation': attrs.hs_color[1],
                    'brightness': attrs.brightness
                  } | to_json }}
                {% elif attrs.color_temp is defined %}
                  {{ {
                    'color_temp': attrs.color_temp,
                    'brightness': attrs.brightness
                  } | to_json }}
                {% else %}
                  {{ {
                    'brightness': attrs.brightness
                  } | to_json }}
                {% endif %}
              {% else %}
                {{ {'state': 'off'} | to_json }}
              {% endif %}
        - service: persistent_notification.create
          data:
            title: "Scene Stored"
            message: "Scene {{ scene_number }} for instance {{ instance }} has been stored"

    # All recall actions handled in one block
    - conditions:
        - condition: template
          value_template: "{{ is_recall_action }}"
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ states(storage_entity) not in ['unknown', 'unavailable', ''] }}"
            sequence:
              - variables:
                  stored_data: "{{ states(storage_entity) | from_json }}"

              - service: persistent_notification.create
                data:
                  title: "Debug Recall Operation"
                  message: >
                    {% set data = {} %}
                    {% if stored_data.get('state') is defined  %}
                      {% set data = data | combine({'state': stored_data.state}) %}
                    {% endif %}
                    {% if stored_data.get('hue') is defined and stored_data.get('saturation') is defined %}
                      {% set data = data | combine({'hs_color': [stored_data.hue, stored_data.saturation]}) %}
                    {% endif %}
                    {% if stored_data.get('color_mode') is defined %}
                      {% set data = data | combine({'color_mode': stored_data.color_mode}) %}
                    {% endif %}
                    {% if stored_data.get('color_temp') is defined %}
                      {% set data = data | combine({'color_temp': stored_data.color_temp}) %}
                    {% endif %}
                    {% if stored_data.get('brightness') is defined %}
                      {% set data = data | combine({'brightness': stored_data.brightness}) %}
                    {% endif %}
                    {{ data }}

              - if:
                  - condition: template
                    value_template: "{{ stored_data.get('state') == 'off' }}"
                then:
                  - service: light.turn_off
                    target:
                      entity_id: "{{ target_light }}"
                else:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_light }}"
                    data: >
                      {% set data = {} %}
                      {% if stored_data.get('hue') is defined and stored_data.get('saturation') is defined %}
                        {% set data = data | combine({'hs_color': [stored_data.hue, stored_data.saturation]}) %}
                      {% endif %}
                      {% if stored_data.get('color_temp') is defined and stored_data.get('color_temp') is number %}
                        {% set data = data | combine({'color_temp': stored_data.color_temp}) %}
                      {% endif %}
                      {% if stored_data.get('brightness') is defined %}
                        {% set data = data | combine({'brightness': stored_data.brightness}) %}
                      {% endif %}
                      {{ data }}

    # Power Off
    - conditions:
        - condition: template
          value_template: '{{ action == "off" }}'
      sequence:
        - service: light.toggle
          target:
            entity_id: "{{ target_light }}"

    # Power On
    - conditions:
        - condition: template
          value_template: '{{ action == "on" }}'
      sequence:
        - service: light.toggle
          target:
            entity_id: "{{ target_light }}"

    # Brightness Down
    - conditions:
        - condition: template
          value_template: '{{ action == "brightness_step_down" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness_step_pct: "{{ -brightness_step_val }}"

    # Brightness Up
    - conditions:
        - condition: template
          value_template: '{{ action == "brightness_step_up" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness_step_pct: "{{ brightness_step_val }}"

    # Fire (Warmer color temperature)
    - conditions:
        - condition: template
          value_template: '{{ action == "color_temperature_step_up" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            color_temp: "{{ [state_attr(target_light, 'color_temp') + color_temp_step_val, 500] | min }}"

    # Snow (Cooler color temperature)
    - conditions:
        - condition: template
          value_template: '{{ action == "color_temperature_step_down" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            color_temp: "{{ [state_attr(target_light, 'color_temp') - color_temp_step_val, 153] | max }}"

    # Scene presets (S1-S7) - Different brightness levels
    - conditions:
        - condition: template
          value_template: '{{ action == "recall_1" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 36  # ~14%

    - conditions:
        - condition: template
          value_template: '{{ action == "recall_2" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 72  # ~28%

    - conditions:
        - condition: template
          value_template: '{{ action == "recall_3" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 108  # ~42%

    - conditions:
        - condition: template
          value_template: '{{ action == "recall_4" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 144  # ~56%

    - conditions:
        - condition: template
          value_template: '{{ action == "recall_5" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 180  # ~70%

    - conditions:
        - condition: template
          value_template: '{{ action == "recall_6" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 216  # ~84%

    - conditions:
        - condition: template
          value_template: '{{ action == "recall_7" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            brightness: 255  # 100%

    # Skip - Cycle through common colors
    - conditions:
        - condition: template
          value_template: '{{ action == "color_temperature_move" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            rgb_color: [255, 255, 255]  # White

    # Repeat - Toggle light
    - conditions:
        - condition: template
          value_template: '{{ action == "move_hue" }}'
      sequence:
        - service: light.toggle
          target:
            entity_id: "{{ target_light }}"

    # Color wheel button press
    - conditions:
        - condition: template
          value_template: '{{ action == "move_to_saturation" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            effect: "colorloop"

    # Color wheel movement - Set hue and saturation
    - conditions:
        - condition: template
          value_template: '{{ action == "move_to_hue_and_saturation" }}'
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ target_light }}"
          data:
            hs_color:
              - "{{ trigger.payload_json.action_hue / 255 * 360 }}"
              - "{{ trigger.payload_json.action_saturation / 255 * 100 }}"
            brightness: "{{ target_brightness }}"