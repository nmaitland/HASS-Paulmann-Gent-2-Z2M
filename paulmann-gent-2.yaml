    # action":"move_to_hue_and_saturation","action_hue":191,"action_saturation":214,"action_transition_time":0
    - conditions:
        - condition: template
          value_template: '{{ action == "move_to_hue_and_saturation" }}'
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ instance == 1 }}"
            sequence:
              - variables:
                  light: !input "sc1_color_wheel_light"
                  do_it_anyway: !input "sc1_color_wheel_on_if_off"
              - if:
                  - condition: template
                    value_template: '{{ do_it_anyway or is_state(light, "on") }}'
                then:
                  - action: light.turn_on
                    target:
                      entity_id: !input "sc1_color_wheel_light"
                    data:
                      hs_color:
                        - "{{ trigger.payload_json.action_hue / 255 * 360 }}"
                        - "{{ trigger.payload_json.action_saturation / 255 * 100 }}"
                      brightness: !input "sc1_color_wheel_brightness"
          - conditions:
