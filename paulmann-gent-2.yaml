trigger:
  # Listen for any event from the remote.
- platform: mqtt
  topic: !input remote_action

mode: queued

action:
  - variables:
      # Parse the incoming payload using the new variable format
      split_input: "{{ trigger.payload_json.action.split('_') }}"
      action: "{{ split_input[:-1] | join('_') }}"
      instance: "{{ split_input[-1] | int }}"

  - service: persistent_notification.create
    data:
      title: "Paulmann Gent 2 Debug"
      message: "JSON payload: {{ trigger.payload_json }}, action: {{ action }}, instance: {{ instance }}"
      
  - choose:
    - conditions:
        - condition: template
          value_template: '{{ action == "off" }}'
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ instance == 1 }}"
            sequence: !input "sc1_power_off"
          - conditions:
              - condition: template
                value_template: "{{ instance == 2 }}"
            sequence: !input "sc2_power_off"
          - conditions:
              - condition: template
                value_template: "{{ instance == 3 }}"
            sequence: !input "sc3_power_off"
          - conditions:
              - condition: template
                value_template: "{{ instance == 4 }}"
            sequence: !input "sc4_power_off"

    - conditions:
        - condition: template
          value_template: '{{ action == "on" }}'
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ instance == 1 }}"
            sequence: !input "sc1_power_on"
          - conditions:
              - condition: template
                value_template: "{{ instance == 2 }}"
            sequence: !input "sc2_power_on"
          - conditions:
              - condition: template
                value_template: "{{ instance == 3 }}"
            sequence: !input "sc3_power_on"
          - conditions:
              - condition: template
                value_template: "{{ instance == 4 }}"
            sequence: !input "sc4_power_on"

    - conditions:
        - condition: template
          value_template: '{{ action == "brightness_step_down" }}'
      sequence:
