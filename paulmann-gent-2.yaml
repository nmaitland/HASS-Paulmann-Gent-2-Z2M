          value_template: '{{ action == "brightness_step_up" }}'
      sequence:
        - choose:
          - conditions:
              - condition: template
                value_template: "{{ instance == 1 }}"
            sequence: !input "sc1_brightness_higher"
          - conditions:
              - condition: template
                value_template: "{{ instance == 2 }}"
            sequence: !input "sc2_brightness_higher"
          - conditions:
              - condition: template
                value_template: "{{ instance == 3 }}"
            sequence: !input "sc3_brightness_higher"
          - conditions:
              - condition: template
                value_template: "{{ instance == 4 }}"
            sequence: !input "sc4_brightness_higher"

    - conditions:
        - condition: template
          value_template: '{{ action == "color_temperature_step_up" }}'
      sequence:
        - choose:
          - conditions:
              - condition: template
